<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center | Hotel Menu Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #050505; color: #ededed; display: flex; }
/* Global Loader for Security */
#authLoader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #D4AF37; font-family: 'Playfair Display', serif; }

.sidebar { width: 260px; height: 100vh; background: #0a0a0a; border-right: 1px solid #1a1a1a; padding: 40px 20px; position: fixed; }
.brand { font-family: 'Playfair Display', serif; font-size: 24px; color: #D4AF37; margin-bottom: 50px; text-align: center; }
.nav-link { display: block; padding: 14px 20px; color: #888; text-decoration: none; margin-bottom: 10px; border-radius: 6px; font-size: 14px; font-weight: 500; transition: 0.3s; }
.nav-link:hover, .nav-link.active { background: #111; color: #D4AF37; }

.main-content { margin-left: 260px; width: 100%; padding: 50px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; padding-bottom: 20px; margin-bottom: 40px; }
.page-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 600; }
.action-btn { background: #D4AF37; color: #000; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: 600; font-size: 14px; transition: 0.3s; }
.action-btn:hover { background: #b5952f; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 50px; }
.stat-card { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 30px; border-radius: 8px; }
.stat-value { font-size: 36px; color: #D4AF37; font-weight: 600; margin-bottom: 10px; font-family: 'Playfair Display', serif; }
.stat-label { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

.data-section { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 8px; overflow: hidden; }
.data-header { padding: 25px 30px; border-bottom: 1px solid #1a1a1a; font-size: 16px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 20px 30px; text-align: left; border-bottom: 1px solid #1a1a1a; }
th { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
td { font-size: 14px; color: #ccc; }
.hotel-link { color: #D4AF37; text-decoration: none; font-weight: 500; font-size: 15px; }
.hotel-link:hover { text-decoration: underline; }
.badge-active { background: rgba(212, 175, 55, 0.1); color: #D4AF37; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; border: 1px solid rgba(212, 175, 55, 0.2); }
</style>
</head>
<body>
<div id="authLoader">Securing Connection...</div>

<div class="sidebar">
    <div class="brand">Hotel Menu Pro</div>
    <a href="#" class="nav-link active">Overview</a>
    <a href="add-hotel.html" class="nav-link">Deploy New Hotel</a>
    <a href="#" class="nav-link">Financials</a>
    <a href="#" class="nav-link">System Logs</a>
    <a href="index.html" class="nav-link" style="margin-top: 50px; color: #ff4444;">Disconnect</a>
</div>

<div class="main-content">
    <div class="top-bar">
        <div class="page-title">Command Center</div>
        <a href="add-hotel.html" class="action-btn">Initialize Client</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="totalHotels">0</div><div class="stat-label">Total Portfolios</div></div>
        <div class="stat-card"><div class="stat-value" id="activeHotels">0</div><div class="stat-label">Active Deployments</div></div>
        <div class="stat-card"><div class="stat-value">100%</div><div class="stat-label">System Uptime</div></div>
        <div class="stat-card"><div class="stat-value">SECURE</div><div class="stat-label">Network Status</div></div>
    </div>

    <div class="data-section">
        <div class="data-header">Active Hotel Portfolios</div>
        <table>
            <thead>
                <tr><th>Entity Name</th><th>Principal Owner</th><th>Operations</th></tr>
            </thead>
            <tbody id="hotelList">
                <tr><td colspan="3" style="text-align:center;">Fetching secure data...</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script type="module" src="dashboard.js"></script>
</body>
</html>
