<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center | Hotel Menu Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #050505; color: #ededed; display: flex; }

#authLoader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #D4AF37; font-family: 'Playfair Display', serif; }

.sidebar { width: 260px; height: 100vh; background: #0a0a0a; border-right: 1px solid #1a1a1a; padding: 40px 20px; position: fixed; }
.brand { font-family: 'Playfair Display', serif; font-size: 24px; color: #D4AF37; margin-bottom: 50px; text-align: center; }
.nav-link { display: block; padding: 15px 20px; color: #888; text-decoration: none; margin-bottom: 10px; border-radius: 6px; transition: 0.3s; font-size: 14px; letter-spacing: 0.5px; }
.nav-link:hover, .nav-link.active { background: #111; color: #D4AF37; }

.main-content { margin-left: 260px; padding: 40px 50px; width: calc(100% - 260px); }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
.page-title { font-size: 28px; font-family: 'Playfair Display', serif; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
.stat-card { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 25px; border-radius: 8px; }
.stat-value { font-size: 32px; color: #D4AF37; margin-bottom: 5px; font-weight: 600; }
.stat-label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

.data-section { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 8px; padding: 30px; }
.data-header { font-size: 18px; margin-bottom: 20px; color: #D4AF37; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 15px; border-bottom: 1px solid #1a1a1a; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
td { padding: 15px; border-bottom: 1px solid #111; font-size: 14px; }
.hotel-link { color: #fff; text-decoration: none; font-weight: 500; transition: 0.3s; }
.hotel-link:hover { color: #D4AF37; }
.badge-active { background: rgba(212, 175, 55, 0.1); color: #D4AF37; padding: 4px 10px; border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

.action-btn { background: #D4AF37; color: #050505; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: 600; transition: 0.3s; }
.action-btn:hover { background: #b5952f; }
</style>
</head>
<body>

<div id="authLoader">Authenticating Secure Connection...</div>

<div class="sidebar">
    <div class="brand">Menu Pro</div>
    <a href="#" class="nav-link active">Command Center</a>
    <a href="add-hotel.html" class="nav-link">Deploy New Hotel</a>
    <a href="#" class="nav-link">Financials</a>
    <a href="#" class="nav-link">System Logs</a>
    <a href="#" id="logoutBtn" class="nav-link" style="margin-top: 50px; color: #ff4444; cursor: pointer;">Log Out</a>
</div>

<div class="main-content">
    <div class="top-bar">
        <div class="page-title">Command Center</div>
        <a href="add-hotel.html" class="action-btn">Initialize Client</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="totalHotels">0</div><div class="stat-label">Total Portfolios</div></div>
        <div class="stat-card"><div class="stat-value" id="activeHotels">0</div><div class="stat-label">Active Deployments</div></div>
        <div class="stat-card"><div class="stat-value">100%</div><div class="stat-label">System Uptime</div></div>
        <div class="stat-card"><div class="stat-value">SECURE</div><div class="stat-label">Network Status</div></div>
    </div>

    <div class="data-section">
        <div class="data-header">Active Hotel Portfolios</div>
        <table>
            <thead>
                <tr><th>Entity Name</th><th>Principal Owner</th><th>Status</th></tr>
            </thead>
            <tbody id="hotelList">
                </tbody>
        </table>
    </div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
