<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Menu Pro - Enterprise Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { display: flex; background: #0f172a; color: #f8fafc; }
.sidebar {
    width: 280px; height: 100vh; background: #1e293b; padding: 30px 20px;
    position: fixed; left: 0; top: 0; border-right: 1px solid rgba(255,255,255,0.05);
}
.logo { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 50px; color: #fbbf24; letter-spacing: 0.5px; }
.menu a {
    display: flex; align-items: center; padding: 16px 20px; margin-bottom: 8px;
    color: #cbd5e1; text-decoration: none; border-radius: 12px; transition: all 0.3s ease; font-weight: 500;
}
.menu a:hover { background: #334155; color: #fbbf24; transform: translateX(5px); }
.main { margin-left: 280px; padding: 40px; width: 100%; min-height: 100vh; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
.header h1 { font-size: 28px; font-weight: 600; color: #f8fafc; }
.add-btn {
    background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 14px 24px;
    border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 15px;
    box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); transition: 0.3s;
}
.add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 40px; }
.card {
    background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: 0.3s;
}
.card:hover { transform: translateY(-5px); border-color: rgba(245, 158, 11, 0.3); }
.card h2 { font-size: 40px; color: #fbbf24; font-weight: 700; }
.card p { margin-top: 10px; color: #94a3b8; font-size: 15px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
.table-box {
    background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.table-title { font-size: 20px; font-weight: 600; margin-bottom: 25px; color: #f8fafc; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 18px 20px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
th { background: rgba(0,0,0,0.2); color: #94a3b8; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
tr:hover td { background: rgba(255,255,255,0.02); }
td { color: #e2e8f0; font-size: 15px; }
.status-active { color: #10b981; font-weight: 600; background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; display: inline-block; font-size: 13px;}
.status-inactive { color: #ef4444; font-weight: 600; background: rgba(239, 68, 68, 0.1); padding: 6px 12px; border-radius: 20px; display: inline-block; font-size: 13px;}
@media(max-width: 768px){ .sidebar { width: 100%; height: auto; position: relative; } .main { margin-left: 0; padding: 20px; } body { flex-direction: column; } }
</style>
</head>
<body>
<div class="sidebar">
    <div class="logo">🍽 Hotel Menu Pro</div>
    <div class="menu">
        <a href="#">📊 Dashboard</a>
        <a href="#">🏨 Hotels</a>
        <a href="add-hotel.html">➕ Add Hotel</a>
        <a href="#">📱 QR Menus</a>
        <a href="#">💳 Subscriptions</a>
        <a href="#">📈 Analytics</a>
        <a href="#">⚙ Settings</a>
        <a href="index.html">🚪 Logout</a>
    </div>
</div>
<div class="main">
    <div class="header">
        <h1>Super Admin Overview</h1>
        <button class="add-btn" onclick="window.location.href='add-hotel.html'">+ Add Hotel</button>
    </div>
    <div class="cards">
        <div class="card">
            <h2 id="totalHotels">0</h2>
            <p>Total Hotels</p>
        </div>
        <div class="card">
            <h2 id="activeHotels">0</h2>
            <p>Active Hotels</p>
        </div>
        <div class="card">
            <h2>0</h2>
            <p>QR Menus</p>
        </div>
        <div class="card">
            <h2>0</h2>
            <p>Subscriptions</p>
        </div>
    </div>
    <div class="table-box">
        <div class="table-title">Recent Hotels Registered</div>
        <table>
            <thead>
                <tr>
                    <th>Hotel Name</th>
                    <th>Owner</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="hotelList">
                <tr><td>No Data Yet</td><td>-</td><td>-</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script type="module" src="dashboard.js"></script>
</body>
</html>
