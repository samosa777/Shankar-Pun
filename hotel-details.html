<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entity Control | Hotel Menu Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #050505; color: #ededed; display: flex; }
#authLoader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #D4AF37; }

.sidebar { width: 260px; height: 100vh; background: #0a0a0a; border-right: 1px solid #1a1a1a; padding: 40px 20px; position: fixed; }
.brand { font-family: 'Playfair Display', serif; font-size: 24px; color: #D4AF37; margin-bottom: 50px; text-align: center; }
.nav-link { display: block; padding: 14px 20px; color: #888; text-decoration: none; margin-bottom: 10px; border-radius: 6px; font-size: 14px; transition: 0.3s; }
.nav-link:hover { background: #111; color: #D4AF37; }

.main-content { margin-left: 260px; width: 100%; padding: 50px; }
.header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid #1a1a1a; padding-bottom: 20px; }
.hotel-title { font-family: 'Playfair Display', serif; font-size: 36px; color: #D4AF37; margin-bottom: 5px; }
.hotel-id { color: #666; font-size: 12px; font-family: monospace; }

.btn-primary { background: #D4AF37; color: #000; padding: 10px 20px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.3s; }
.btn-primary:hover { background: #b5952f; }
.btn-danger { background: #ff4444; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; margin-left: 10px; }

.section-block { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 8px; padding: 30px; margin-bottom: 30px; }
.section-title { font-size: 18px; color: #fff; margin-bottom: 25px; border-left: 3px solid #D4AF37; padding-left: 15px; font-family: 'Playfair Display', serif; }

.grid-edit { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.input-group { display: flex; flex-direction: column; }
.input-group label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px 15px; background: #111; border: 1px solid #222; border-radius: 4px; color: #fff; font-size: 14px; outline: none; }
.input-group input:disabled, .input-group select:disabled { background: transparent; border-color: transparent; padding-left: 0; color: #ccc; -webkit-appearance: none; appearance: none; }
.input-group input:focus, .input-group select:focus { border-color: #D4AF37; }

.qr-container { display: flex; align-items: center; gap: 40px; }
.qr-container img { border: 4px solid #222; border-radius: 8px; }
.qr-link { color: #D4AF37; font-size: 14px; word-break: break-all; margin-top: 10px; display: block; }
</style>
</head>
<body>
<div id="authLoader">Authenticating Admin...</div>

<div class="sidebar">
    <div class="brand">Hotel Menu Pro</div>
    <a href="dashboard.html" class="nav-link">← Back to Dashboard</a>
</div>

<div class="main-content">
    <div class="header-flex">
        <div>
            <h1 class="hotel-title" id="displayHotelName">Loading...</h1>
            <div class="hotel-id" id="displayDocId">ID: --------</div>
        </div>
        <div>
            <button class="btn-primary" id="toggleEditBtn">Enable Edit Mode</button>
            <button class="btn-primary" id="saveBtn" style="display:none; background:#10b981; color:white;">Save Changes</button>
        </div>
    </div>

    <div class="section-block">
        <div class="section-title">Master Entity Records</div>
        <div class="grid-edit">
            <div class="input-group"><label>Hotel Name</label><input type="text" id="v_hotelName" disabled></div>
            <div class="input-group"><label>Principal Owner</label><input type="text" id="v_ownerName" disabled></div>
            <div class="input-group"><label>Mobile</label><input type="text" id="v_mobile" disabled></div>
            <div class="input-group"><label>WhatsApp</label><input type="text" id="v_whatsapp" disabled></div>
            <div class="input-group"><label>Address</label><input type="text" id="v_address" disabled></div>
            <div class="input-group"><label>City</label><input type="text" id="v_city" disabled></div>
            <div class="input-group"><label>State</label><input type="text" id="v_state" disabled></div>
            <div class="input-group"><label>Country</label><input type="text" id="v_country" disabled></div>
            <div class="input-group"><label>Maps URL</label><input type="text" id="v_maps" disabled></div>
            <div class="input-group"><label>Website</label><input type="text" id="v_website" disabled></div>
            <div class="input-group"><label>Facebook</label><input type="text" id="v_facebook" disabled></div>
            <div class="input-group"><label>Instagram</label><input type="text" id="v_instagram" disabled></div>
            <div class="input-group"><label>Subscription Plan</label><input type="text" id="v_plan" disabled></div>
            <div class="input-group">
                <label>Access Status</label>
                <select id="v_status" disabled>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
        </div>
    </div>

    <!-- यहाँ पासवर्ड देखने और डायरेक्ट बदलने का ऑप्शन डाल दिया गया है -->
    <div class="section-block">
        <div class="section-title">Security & Credentials</div>
        <div class="grid-edit" style="margin-bottom: 20px;">
            <div class="input-group"><label>Registered Email (Username)</label><input type="email" id="v_email" disabled></div>
            <div class="input-group"><label>Current Password</label><input type="text" id="v_password" disabled></div>
        </div>
        <button class="btn-danger" id="resetPassBtn">Send Password Reset Link to Client</button>
    </div>

    <div class="section-block">
        <div class="section-title">Deployment QR</div>
        <div class="qr-container">
            <img id="qrImage" src="" width="150" alt="QR">
            <div>
                <span style="color:#666; font-size:12px; text-transform:uppercase;">Live Link</span>
                <a href="#" class="qr-link" id="menuLink" target="_blank">Loading...</a>
            </div>
        </div>
    </div>
</div>
<script type="module" src="hotel-details.js"></script>
</body>
</html>
