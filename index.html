<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Admin Panel - Multi User</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%;
            max-width: 600px; 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
        }
        h1 { text-align: center; color: #333333; font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666666; font-size: 14px; margin-bottom: 25px; margin-top: 0;}
        
        .form-group { margin-bottom: 15px; }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cccccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px; 
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #1877f2; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px;
            transition: background-color 0.3s; 
        }
        button:hover { background-color: #166fe5; }
        .btn-secondary { background-color: #42b72a; }
        .btn-secondary:hover { background-color: #36a420; }
        .btn-danger { background-color: #dc3545; margin-bottom: 20px;}
        .btn-danger:hover { background-color: #c82333; }
        .btn-small { padding: 6px 12px; font-size: 12px; width: auto; margin-top: 0; }
        .btn-edit { background-color: #ffc107; color: black; }
        .btn-delete { background-color: #dc3545; }

        /* Sections toggling */
        #dashboardSection { display: none; }
        
        /* Menu List Styles */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .menu-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .menu-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
            background-color: #f0f0f0;
        }
        .menu-details { flex-grow: 1; }
        .menu-title { font-size: 18px; font-weight: bold; color: #333; margin: 0 0 5px 0; }
        .menu-price { font-size: 16px; font-weight: bold; color: #28a745; margin: 0; }
        .menu-actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
    </style>
</head>
<body>

<div class="container" id="authSection">
    <h1>Restaurant Admin Panel</h1>
    <p class="subtitle">Secure Login</p>
    
    <div class="form-group">
        <input type="email" id="emailInput" placeholder="Enter Email Address" required>
    </div>
    <div class="form-group">
        <input type="password" id="passwordInput" placeholder="Enter Password" required>
    </div>
    
    <button id="loginBtn">Login</button>
    <button id="registerBtn" class="btn-secondary">Create New Account</button>
</div>

<div class="container" id="dashboardSection">
    <h1>My Custom Menu</h1>
    <p class="subtitle" id="userEmailDisplay"></p>
    <button id="logoutBtn" class="btn-danger">Logout</button>
    
    <hr>
    
    <h3>Add New Item</h3>
    <div class="form-group">
        <input type="text" id="itemName" placeholder="Dish Name (e.g., Veg Burger)" required>
    </div>
    <div class="form-group">
        <input type="number" id="itemPrice" placeholder="Price (e.g., 150)" required>
    </div>
    <div class="form-group">
        <input type="text" id="itemImage" placeholder="Image URL (Paste any image link here)" required>
    </div>
    <button id="addMenuBtn">Save to Menu</button>

    <hr>
    <h3>Your Menu Items</h3>
    <div id="menuList" class="menu-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtF4Oejs17wjZbZj7df4mTUitaKMR_CdI",
      authDomain: "hotel-menu-manager.firebaseapp.com",
      projectId: "hotel-menu-manager",
      storageBucket: "hotel-menu-manager.firebasestorage.app",
      messagingSenderId: "434432605981",
      appId: "1:434432605981:web:a16c77f7462da05669abf4",
      measurementId: "G-68CN4DCZHW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;

    const authSection = document.getElementById('authSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const menuList = document.getElementById('menuList');

    // Register User
    document.getElementById('registerBtn').addEventListener('click', async () => {
        const email = emailInput.value;
        const password = passwordInput.value;
        if(!email || !password) return alert("Please enter email and password.");
        try {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("Account created successfully!");
        } catch (error) {
            alert("Registration Error: " + error.message);
        }
    });

    // Login User
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = emailInput.value;
        const password = passwordInput.value;
        if(!email || !password) return alert("Please enter email and password.");
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            alert("Login Failed: " + error.message);
        }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
    });

    // Load User Specific Menu
    async function loadMenuItems() {
        if (!currentUserId) return;
        menuList.innerHTML = "Loading your menu...";
        
        // QUERY: Fetch ONLY the logged-in user's data
        const q = query(collection(db, "menu_items"), where("userId", "==", currentUserId));
        const querySnapshot = await getDocs(q);
        
        menuList.innerHTML = "";
        
        querySnapshot.forEach((docSnap) => {
            const item = docSnap.data();
            const itemId = docSnap.id;
            
            const card = document.createElement('div');
            card.className = 'menu-card';
            
            // Fallback image if URL is empty
            const imgUrl = item.image || "https://via.placeholder.com/80?text=No+Image";

            card.innerHTML = `
                <img src="${imgUrl}" class="menu-image" alt="Dish Image">
                <div class="menu-details">
                    <h4 class="menu-title">${item.name}</h4>
                    <p class="menu-price">Rs. ${item.price}</p>
                </div>
                <div class="menu-actions">
                    <button class="btn-small btn-edit" onclick="editItem('${itemId}', '${item.name}', '${item.price}')">Edit</button>
                    <button class="btn-small btn-delete" onclick="deleteItem('${itemId}')">Delete</button>
                </div>
            `;
            menuList.appendChild(card);
        });
    }

    // Add Menu Item with User ID
    document.getElementById('addMenuBtn').addEventListener('click', async () => {
        const name = document.getElementById('itemName').value;
        const price = document.getElementById('itemPrice').value;
        const image = document.getElementById('itemImage').value;
        
        if(!name || !price) return alert("Name and Price are required.");
        
        try {
            await addDoc(collection(db, "menu_items"), { 
                name: name, 
                price: price,
                image: image,
                userId: currentUserId // This binds the item to the specific user
            });
            
            document.getElementById('itemName').value = "";
            document.getElementById('itemPrice').value = "";
            document.getElementById('itemImage').value = "";
            
            alert("Item added successfully!");
            loadMenuItems(); 
        } catch (error) {
            alert("Error adding item: " + error.message);
        }
    });

    // Global Edit Function
    window.editItem = async (id, oldName, oldPrice) => {
        const newName = prompt("Enter new name:", oldName);
        if (newName === null) return; // User cancelled
        
        const newPrice = prompt("Enter new price:", oldPrice);
        if (newPrice === null) return; // User cancelled

        try {
            const itemRef = doc(db, "menu_items", id);
            await updateDoc(itemRef, {
                name: newName,
                price: newPrice
            });
            alert("Item updated successfully!");
            loadMenuItems();
        } catch (error) {
            alert("Error updating item: " + error.message);
        }
    };

    // Global Delete Function
    window.deleteItem = async (id) => {
        if(confirm("Are you sure you want to delete this item?")) {
            try {
                await deleteDoc(doc(db, "menu_items", id));
                loadMenuItems();
            } catch (error) {
                alert("Error deleting item: " + error.message);
            }
        }
    };

    // Listen to Auth State
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserId = user.uid;
            authSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            userEmailDisplay.innerText = "Logged in as: " + user.email;
            loadMenuItems();
        } else {
            currentUserId = null;
            authSection.style.display = 'block';
            dashboardSection.style.display = 'none';
        }
    });
</script>
</body>
</html>
