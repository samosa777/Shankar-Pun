<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Sign In | Hotel Menu Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; min-height: 100vh; background-color: #050505; color: #fff; overflow-x: hidden; flex-direction: column; }
        @media(min-width: 900px) { body { flex-direction: row; } }
        .hero-section { flex: 1.2; position: relative; background: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80') center/cover; min-height: 40vh; }
        @media(min-width: 900px) { .hero-section { min-height: 100vh; } }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,5,5,0.2) 0%, rgba(5,5,5,1) 100%); }
        @media(min-width: 900px) { .hero-overlay { background: linear-gradient(90deg, rgba(5,5,5,0.2) 0%, rgba(5,5,5,1) 100%); } }
        .login-section { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 20px; max-width: 500px; margin: auto; width: 100%; }
        @media(min-width: 900px) { .login-section { padding: 40px 8%; max-width: none; margin: 0; } }
        .brand { font-family: 'Playfair Display', serif; font-size: 36px; color: #D4AF37; margin-bottom: 8px; font-weight: 700; text-shadow: 0 4px 10px rgba(212,175,55,0.1); }
        .subtitle { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; }
        .input-group { margin-bottom: 25px; position: relative; }
        .input-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #aaa; margin-bottom: 8px; font-weight: 500; }
        .input-group input { width: 100%; background: #0f0f0f; border: 1px solid #1a1a1a; padding: 16px; border-radius: 8px; color: #fff; font-size: 14px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .input-group input:focus { border-color: #D4AF37; background: #121212; outline: none; box-shadow: 0 0 15px rgba(212,175,55,0.1); }
        .btn-primary { background: #D4AF37; color: #050505; border: none; padding: 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 15px; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; width: 100%; }
        .btn-primary:hover { background: #f3cb52; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,175,55,0.3); }
        #authLoader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: none; justify-content: center; align-items: center; font-size: 20px; color: #D4AF37; font-family: 'Playfair Display', serif; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="authLoader">VERIFYING SECURE ACCESS...</div>
    <div class="hero-section"><div class="hero-overlay"></div></div>
    <div class="login-section">
        <div class="brand">Hotel Menu Pro</div>
        <div class="subtitle">Secure Enterprise Access Management</div>
        <div class="input-group">
            <label>Authorized Email</label>
            <input type="email" id="username" placeholder="admin@enterprise.com" required>
        </div>
        <div class="input-group">
            <label>Security Password Architecture</label>
            <input type="password" id="password" placeholder="••••••••••••" required>
        </div>
        <button class="btn-primary" id="loginBtn">Authenticate System</button>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
