<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System - Portal</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            color: #333;
        }
        .container { 
            width: 100%;
            max-width: 700px; 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            margin: 4px auto;
        }
        .login-box { max-width: 420px; margin-top: 10vh; }
        h1, h2, h3 { text-align: center; color: #111111; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-top: -10px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cccccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px; 
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #0056b3; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background-color: #004085; }
        .btn-green { background-color: #28a745; }
        .btn-green:hover { background-color: #1e7e34; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #bd2130; }
        
        /* App Sections */
        #superAdminSection, #userSection { display: none; }
        
        /* User List Tabs for Admin */
        .user-badge {
            background: #f8f9fa;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #eee;
            border-left: 6px solid #0056b3;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-badge:hover { background: #e9ecef; }
        
        /* Menu Cards */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        .menu-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .menu-image {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
            background: #f0f0f0;
        }
        .menu-details { flex-grow: 1; }
        .menu-title { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; }
        .menu-price { font-size: 16px; font-weight: bold; color: #28a745; margin: 0; }
        .action-btns { display: flex; flex-direction: column; gap: 5px; }
        .btn-small { padding: 6px 12px; font-size: 13px; width: auto; margin: 0; }
        .admin-box { background: #fdfdfd; border: 1px dashed #bbb; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 30px 0; }
    </style>
</head>
<body>

<div class="container login-box" id="authSection">
    <h1>System Portal</h1>
    <p class="subtitle">Authorized Sign In Only</p>
    <div class="form-group">
        <input type="email" id="emailInput" placeholder="Username / Email" required>
    </div>
    <div class="form-group">
        <input type="password" id="passwordInput" placeholder="Password" required>
    </div>
    <button id="loginBtn">Secure Login</button>
</div>

<div class="container" id="superAdminSection">
    <h1>Master Controller Console</h1>
    <p class="subtitle" id="adminEmailDisplay"></p>
    <button id="adminLogoutBtn" class="btn-danger">System Logout</button>
    
    <hr>
    
    <div class="admin-box">
        <h3>Create New User Account</h3>
        <div class="form-group">
            <input type="email" id="newDocEmail" placeholder="New User Email (e.g. hotel1@test.com)">
        </div>
        <div class="form-group">
            <input type="password" id="newDocPassword" placeholder="New User Password">
        </div>
        <button id="createAccountBtn" class="btn-green">Generate & Register User</button>
    </div>

    <hr>
    <h3>Active Registered Clients</h3>
    <div id="usersListContainer"></div>
    
    <hr>
    <div id="adminManagementZone" style="display: none;">
        <h3 id="managingUserTitle">Target: None</h3>
        <div class="form-group">
            <input type="text" id="adminItemName" placeholder="Dish Name">
        </div>
        <div class="form-group">
            <input type="number" id="adminItemPrice" placeholder="Price (Rs.)">
        </div>
        <div class="form-group">
            <input type="text" id="adminItemImage" placeholder="Image URL / Link">
        </div>
        <button id="adminAddBtn">Upload Menu Item to Client Portfolio</button>
        
        <div id="adminMenuList" class="menu-grid"></div>
    </div>
</div>

<div class="container" id="userSection">
    <h1>Client Menu Panel</h1>
    <p class="subtitle" id="userEmailDisplay"></p>
    <button id="userLogoutBtn" class="btn-danger">Logout</button>
    
    <hr>
    <h3>Your Authorized Menu Grid</h3>
    <div id="userMenuList" class="menu-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDocs, query, where, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtF4Oejs17wjZbZj7df4mTUitaKMR_CdI",
      authDomain: "hotel-menu-manager.firebaseapp.com",
      projectId: "hotel-menu-manager",
      storageBucket: "hotel-menu-manager.firebasestorage.app",
      messagingSenderId: "434432605981",
      appId: "1:434432605981:web:a16c77f7462da05669abf4",
      measurementId: "G-68CN4DCZHW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Super Admin Definition
    const SUPER_ADMIN_EMAIL = "admin@master.com"; 

    let selectedUserIdForAdmin = null;

    const authSection = document.getElementById('authSection');
    const superAdminSection = document.getElementById('superAdminSection');
    const userSection = document.getElementById('userSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const usersListContainer = document.getElementById('usersListContainer');
    const adminMenuList = document.getElementById('adminMenuList');
    const userMenuList = document.getElementById('userMenuList');

    // Login Trigger
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = emailInput.value;
        const password = passwordInput.value;
        if(!email || !password) return alert("Credentials required.");
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            alert("Login System Error: " + error.message);
        }
    });

    // Secret Registration inside Super Admin Panel
    document.getElementById('createAccountBtn').addEventListener('click', async () => {
        const email = document.getElementById('newDocEmail').value;
        const password = document.getElementById('newDocPassword').value;
        if(!email || !password) return alert("Please enter both fields.");
        
        try {
            // Register user in authentication
            const credential = await createUserWithEmailAndPassword(auth, email, password);
            // Save to Database reference
            await setDoc(doc(db, "users", credential.user.uid), {
                uid: credential.user.uid,
                email: email
            });
            alert("Success: New User Created!");
            document.getElementById('newDocEmail').value = "";
            document.getElementById('newDocPassword').value = "";
            
            // Relogin Admin automatically to ensure token stability
            alert("Notice: Refreshing current list database.");
            loadAllUsers();
        } catch (error) {
            alert("System Denied Registration: " + error.message);
        }
    });

    // Logout Process
    document.getElementById('adminLogoutBtn').addEventListener('click', () => signOut(auth));
    document.getElementById('userLogoutBtn').addEventListener('click', () => signOut(auth));

    // Master Controller: Fetch and Display users
    async function loadAllUsers() {
        usersListContainer.innerHTML = "Syncing database...";
        const querySnapshot = await getDocs(collection(db, "users"));
        usersListContainer.innerHTML = "";
        
        querySnapshot.forEach((userDoc) => {
            const userData = userDoc.data();
            if(userData.email !== SUPER_ADMIN_EMAIL) {
                const div = document.createElement('div');
                div.className = 'user-badge';
                div.innerHTML = `<span>${userData.email}</span>`;
                div.onclick = () => openUserMenuAsAdmin(userData.uid, userData.email);
                usersListContainer.appendChild(div);
            }
        });
    }

    // Direct Access to Client profile via Click
    async function openUserMenuAsAdmin(userId, userEmail) {
        selectedUserIdForAdmin = userId;
        document.getElementById('adminManagementZone').style.display = 'block';
        document.getElementById('managingUserTitle').innerText = "Target Portfolio: " + userEmail;
        loadItemsForAdmin();
    }

    // Load exact items for Admin
    async function loadItemsForAdmin() {
        adminMenuList.innerHTML = "Fetching item nodes...";
        const q = query(collection(db, "menu_items"), where("userId", "==", selectedUserIdForAdmin));
        const snap = await getDocs(q);
        adminMenuList.innerHTML = "";
        
        snap.forEach((itemDoc) => {
            const item = itemDoc.data();
            const card = document.createElement('div');
            card.className = 'menu-card';
            card.innerHTML = `
                <img src="${item.image || 'https://via.placeholder.com/90'}" class="menu-image">
                <div class="menu-details">
                    <h4 class="menu-title">${item.name}</h4>
                    <p class="menu-price">Rs. ${item.price}</p>
                </div>
                <div class="action-btns">
                    <button class="btn-small btn-danger" onclick="deleteItemMaster('${itemDoc.id}')">Remove Item</button>
                </div>
            `;
            adminMenuList.appendChild(card);
        });
    }

    // Add elements with specific photo via Admin
    document.getElementById('adminAddBtn').addEventListener('click', async () => {
        const name = document.getElementById('adminItemName').value;
        const price = document.getElementById('adminItemPrice').value;
        const image = document.getElementById('adminItemImage').value;
        
        if(!name || !price || !image) return alert("All text fields and image links are mandatory.");
        
        try {
            await addDoc(collection(db, "menu_items"), {
                name: name,
                price: price,
                image: image,
                userId: selectedUserIdForAdmin
            });
            document.getElementById('adminItemName').value = "";
            document.getElementById('adminItemPrice').value = "";
            document.getElementById('adminItemImage').value = "";
            alert("Database entry created!");
            loadItemsForAdmin();
        } catch (error) {
            alert("Error adding entry: " + error.message);
        }
    });

    // Delete item node
    window.deleteItemMaster = async (id) => {
        if(confirm("Confirm permanent removal?")) {
            await deleteDoc(doc(db, "menu_items", id));
            loadItemsForAdmin();
        }
    };

    // Client execution zone
    async function loadUserMenu(userId) {
        userMenuList.innerHTML = "Syncing menu allocation data...";
        const q = query(collection(db, "menu_items"), where("userId", "==", userId));
        const snap = await getDocs(q);
        userMenuList.innerHTML = "";
        
        snap.forEach((itemDoc) => {
            const item = itemDoc.data();
            const card = document.createElement('div');
            card.className = 'menu-card';
            card.innerHTML = `
                <img src="${item.image || 'https://via.placeholder.com/90'}" class="menu-image">
                <div class="menu-details">
                    <h4 class="menu-title">${item.name}</h4>
                    <p class="menu-price">Rs. ${item.price}</p>
                </div>
                <div class="action-btns">
                    <button class="btn-small btn-green" onclick="editUserItem('${itemDoc.id}', '${item.name}', '${item.price}')">Change Text/Price</button>
                </div>
            `;
            userMenuList.appendChild(card);
        });
    }

    // Client modification limit (Strictly updates name & price text only)
    window.editUserItem = async (id, currentName, currentPrice) => {
        const newName = prompt("Modify Dish Name String:", currentName);
        if(newName === null) return;
        const newPrice = prompt("Modify Price Numeric Value:", currentPrice);
        if(newPrice === null) return;

        try {
            await updateDoc(doc(db, "menu_items", id), {
                name: newName,
                price: newPrice
            });
            alert("Local client parameters updated.");
            loadUserMenu(auth.currentUser.uid);
        } catch (error) {
            alert("Transaction failed: " + error.message);
        }
    };

    // Main Control Interceptor
    onAuthStateChanged(auth, (user) => {
        if (user) {
            authSection.style.display = 'none';
            if(user.email === SUPER_ADMIN_EMAIL) {
                superAdminSection.style.display = 'block';
                userSection.style.display = 'none';
                document.getElementById('adminEmailDisplay').innerText = "Master Node Status: " + user.email;
                loadAllUsers();
            } else {
                superAdminSection.style.display = 'none';
                userSection.style.display = 'block';
                document.getElementById('userEmailDisplay').innerText = "Client Terminal Node: " + user.email;
                loadUserMenu(user.uid);
            }
        } else {
            authSection.style.display = 'block';
            superAdminSection.style.display = 'none';
            userSection.style.display = 'none';
            emailInput.value = "";
            passwordInput.value = "";
        }
    });
</script>
</body>
</html>
