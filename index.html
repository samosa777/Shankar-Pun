<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Mantra Thakali & Hospitality - Admin Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%;
            max-width: 500px; 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h1 { text-align: center; color: #333333; font-size: 22px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666666; font-size: 14px; margin-bottom: 25px; margin-top: 0;}
        
        .form-group { margin-bottom: 15px; }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px; 
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #0056b3; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 10px;
            transition: background-color 0.3s; 
        }
        button:hover { background-color: #004494; }
        .btn-secondary { background-color: #28a745; }
        .btn-secondary:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; margin-bottom: 20px;}
        .btn-danger:hover { background-color: #c82333; }

        /* Sections toggling */
        #dashboardSection { display: none; }
        
        /* Menu List Styles */
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { 
            background: #f9f9f9; 
            margin-bottom: 10px; 
            padding: 15px; 
            border-radius: 6px; 
            border-left: 5px solid #0056b3; 
            display: flex; 
            justify-content: space-between; 
        }
        .price { font-weight: bold; color: #28a745; }
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
    </style>
</head>
<body>

<div class="container" id="authSection">
    <h1>Hotel Mantra Thakali & Hospitality</h1>
    <p class="subtitle">Admin Login</p>
    
    <div class="form-group">
        <input type="email" id="emailInput" placeholder="Enter Email Address" required>
    </div>
    <div class="form-group">
        <input type="password" id="passwordInput" placeholder="Enter Password" required>
    </div>
    
    <button id="loginBtn">Login to Dashboard</button>
    <button id="registerBtn" class="btn-secondary">Create New Account</button>
</div>

<div class="container" id="dashboardSection">
    <h1>Admin Dashboard</h1>
    <p class="subtitle" id="userEmailDisplay"></p>
    
    <button id="logoutBtn" class="btn-danger">Logout</button>
    <hr>
    
    <div class="form-group">
        <input type="text" id="itemName" placeholder="Enter Dish Name" required>
    </div>
    <div class="form-group">
        <input type="number" id="itemPrice" placeholder="Enter Price (Rs.)" required>
    </div>
    <button id="addMenuBtn">Add to Menu</button>

    <ul id="menuList"></ul>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtF4Oejs17wjZbZj7df4mTUitaKMR_CdI",
      authDomain: "hotel-menu-manager.firebaseapp.com",
      projectId: "hotel-menu-manager",
      storageBucket: "hotel-menu-manager.firebasestorage.app",
      messagingSenderId: "434432605981",
      appId: "1:434432605981:web:a16c77f7462da05669abf4",
      measurementId: "G-68CN4DCZHW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // UI Elements
    const authSection = document.getElementById('authSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const menuList = document.getElementById('menuList');

    // Register User
    document.getElementById('registerBtn').addEventListener('click', async () => {
        const email = emailInput.value;
        const password = passwordInput.value;
        if(!email || !password) return alert("Please enter email and password!");
        try {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("Account created successfully!");
        } catch (error) {
            alert("Error: " + error.message);
        }
    });

    // Login User
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = emailInput.value;
        const password = passwordInput.value;
        if(!email || !password) return alert("Please enter email and password!");
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            alert("Login Failed: " + error.message);
        }
    });

    // Logout User
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
            await signOut(auth);
        } catch (error) {
            alert("Logout Error: " + error.message);
        }
    });

    // Load Menu from Database
    async function loadMenuItems() {
        menuList.innerHTML = "";
        const querySnapshot = await getDocs(collection(db, "menu"));
        querySnapshot.forEach((doc) => {
            const item = doc.data();
            const li = document.createElement('li');
            li.innerHTML = `<span>${item.name}</span> <span class="price">Rs. ${item.price}</span>`;
            menuList.appendChild(li);
        });
    }

    // Add Menu Item
    document.getElementById('addMenuBtn').addEventListener('click', async () => {
        const name = document.getElementById('itemName').value;
        const price = document.getElementById('itemPrice').value;
        if(name === "" || price === "") return alert("Please enter both dish name and price.");
        
        try {
            await addDoc(collection(db, "menu"), { name: name, price: price });
            document.getElementById('itemName').value = "";
            document.getElementById('itemPrice').value = "";
            alert("Menu item added successfully!");
            loadMenuItems(); // Refresh the list
        } catch (error) {
            alert("System Error: " + error.message);
        }
    });

    // Monitor Login Status
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // User is logged in
            authSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            userEmailDisplay.innerText = "Logged in as: " + user.email;
            loadMenuItems();
        } else {
            // User is logged out
            authSection.style.display = 'block';
            dashboardSection.style.display = 'none';
            emailInput.value = "";
            passwordInput.value = "";
        }
    });
</script>
</body>
</html>
