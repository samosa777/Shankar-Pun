<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Sign In | Hotel Menu Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { display: flex; height: 100vh; background-color: #050505; color: #fff; overflow: hidden; }
.hero-section { flex: 1.2; position: relative; background: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80') center/cover; }
.hero-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,5,5,0.2) 0%, rgba(5,5,5,1) 100%); }
.login-section { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 8%; background: #050505; z-index: 10; border-left: 1px solid rgba(255,255,255,0.05); }
.brand { font-family: 'Playfair Display', serif; font-size: 42px; color: #D4AF37; margin-bottom: 10px; letter-spacing: 1px; }
.subtitle { color: #888; font-size: 15px; margin-bottom: 50px; font-weight: 300; }
.input-group { margin-bottom: 25px; }
.input-group label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin-bottom: 8px; font-weight: 600; }
input { width: 100%; padding: 18px 20px; background: #0a0a0a; border: 1px solid #222; border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
input:focus { border-color: #D4AF37; background: #111; }
button { width: 100%; padding: 18px; margin-top: 20px; border: none; border-radius: 8px; background: #D4AF37; color: #050505; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; letter-spacing: 0.5px; }
button:hover { background: #b5952f; transform: translateY(-2px); }
.security-badge { display: flex; align-items: center; justify-content: center; margin-top: 40px; color: #444; font-size: 12px; gap: 8px; }
#authLoader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: none; justify-content: center; align-items: center; font-size: 20px; color: #D4AF37; font-family: 'Playfair Display', serif; }
@media(max-width: 900px){ .hero-section { display: none; } .login-section { flex: 1; padding: 0 5%; } }
</style>
</head>
<body>
    <div id="authLoader">Verifying Secure Access...</div>
    <div class="hero-section"><div class="hero-overlay"></div></div>
    <div class="login-section">
        <div class="brand">Hotel Menu Pro</div>
        <div class="subtitle">Secure Enterprise Access Management</div>
        <div class="input-group">
            <label>Authorized Email</label>
            <input type="email" id="username" placeholder="admin@enterprise.com">
        </div>
        <div class="input-group">
            <label>Security Key</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button id="loginBtn">AUTHENTICATE</button>
        <div class="security-badge">🔒 End-to-End Encrypted Portal</div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
