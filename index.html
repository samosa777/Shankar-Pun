<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Menu Pro - Premium Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1542314831-c6a4d14d2366?auto=format&fit=crop&w=1920&q=80') center/cover;
}
.login-box {
    width: 100%;
    max-width: 420px;
    padding: 50px 40px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    color: white;
}
.logo { text-align: center; font-size: 48px; margin-bottom: 10px; }
.title {
    text-align: center; margin-bottom: 35px; font-size: 26px; font-weight: 700;
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.input-group { position: relative; margin-bottom: 20px; }
input {
    width: 100%; padding: 16px 20px;
    background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; font-size: 15px; color: white; outline: none; transition: all 0.3s ease;
}
input::placeholder { color: #94a3b8; }
input:focus { border-color: #f59e0b; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15); }
button {
    width: 100%; padding: 16px; margin-top: 10px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff;
    font-size: 16px; font-weight: 600; letter-spacing: 0.5px; cursor: pointer; transition: all 0.3s ease;
}
button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); }
.footer { margin-top: 30px; text-align: center; font-size: 13px; color: #94a3b8; font-weight: 300; }
</style>
</head>
<body>
<div class="login-box">
    <div class="logo">🏨</div>
    <div class="title">Hotel Menu Pro</div>
    <div class="input-group">
        <input type="email" id="username" placeholder="Admin Email / Username">
    </div>
    <div class="input-group">
        <input type="password" id="password" placeholder="Secure Password">
    </div>
    <button id="loginBtn">Secure Login</button>
    <div class="footer">Enterprise QR Menu & Management Platform</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
