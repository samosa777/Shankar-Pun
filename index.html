<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hotel Menu Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(0,0,0,0.5),
rgba(0,0,0,0.5)),
url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=80');

background-size:cover;
background-position:center;
}

.login-box{
width:400px;
padding:40px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);
border-radius:20px;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
color:white;
}

.logo{
text-align:center;
font-size:32px;
margin-bottom:10px;
}

.title{
text-align:center;
margin-bottom:30px;
font-size:24px;
font-weight:bold;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:10px;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#ff6b00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
opacity:0.8;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">🍽️</div>

<div class="title">
Hotel Menu Pro
</div>

<input
type="email"
id="username"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<div class="footer">
Smart QR Menu Management System
</div>

</div>

<script src="app.js"></script>

</body>
</html>
