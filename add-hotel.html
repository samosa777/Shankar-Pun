<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Entity | Hotel Menu Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #050505; color: #fff; padding: 40px; display: flex; justify-content: center; }
#authLoader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #D4AF37; }

.form-container { width: 100%; max-width: 900px; background: #0a0a0a; border: 1px solid #1a1a1a; padding: 50px; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
.header { margin-bottom: 40px; border-bottom: 1px solid #1a1a1a; padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.title { font-family: 'Playfair Display', serif; font-size: 28px; color: #D4AF37; }
.back-btn { color: #888; text-decoration: none; font-size: 14px; }

.section-title { font-size: 14px; color: #D4AF37; text-transform: uppercase; letter-spacing: 2px; margin: 30px 0 15px; font-weight: 600; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.full { grid-column: 1 / 3; }

input, select, textarea { width: 100%; padding: 15px; background: #111; border: 1px solid #222; border-radius: 4px; color: #fff; outline: none; transition: 0.3s; }
input:focus, select:focus, textarea:focus { border-color: #D4AF37; }
textarea { height: 80px; resize: none; }

.submit-btn { width: 100%; padding: 18px; margin-top: 40px; background: #D4AF37; color: #000; border: none; border-radius: 4px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.3s; }
.submit-btn:hover { background: #b5952f; }
</style>
</head>
<body>
<div id="authLoader">Verifying Access...</div>
<div class="form-container">
    <div class="header">
        <div class="title">Deploy New Client Entity</div>
        <a href="dashboard.html" class="back-btn">Cancel</a>
    </div>

    <div class="section-title">Core Information</div>
    <div class="grid">
        <input type="text" id="hotelName" placeholder="Hotel / Business Name (e.g. Hotel Mantra Thakali)">
        <input type="text" id="ownerName" placeholder="Principal Owner Name">
        <input type="email" id="email" placeholder="System Login Email">
        <input type="password" id="password" placeholder="Initial Security Password">
    </div>

    <div class="section-title">Contact & Location</div>
    <div class="grid">
        <input type="text" id="mobile" placeholder="Primary Mobile">
        <input type="text" id="whatsapp" placeholder="WhatsApp Number">
        <textarea id="address" class="full" placeholder="Complete Physical Address"></textarea>
        <input type="text" id="city" placeholder="City">
        <input type="text" id="state" placeholder="State/Province">
        <input type="text" id="country" placeholder="Country">
        <input type="text" id="maps" class="full" placeholder="Google Maps Coordinate Link">
    </div>

    <div class="section-title">Digital Assets & Subscription</div>
    <div class="grid">
        <input type="text" id="website" placeholder="Official Website URL">
        <input type="text" id="facebook" placeholder="Facebook Page">
        <input type="text" id="instagram" placeholder="Instagram Handle">
        <select id="plan">
            <option>Elite Plan</option>
            <option>Enterprise Plan</option>
        </select>
        <input type="date" id="startDate">
        <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Suspended</option>
        </select>
    </div>

    <button class="submit-btn" id="createHotelBtn">INITIALIZE DEPLOYMENT</button>
</div>
<script type="module" src="add-hotel.js"></script>
</body>
</html>
