<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Owner Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f3f6fb;
}

.header{
background:#111827;
color:white;
padding:20px;
font-size:24px;
font-weight:bold;
}

.welcome{
background:white;
margin:20px;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.tabs{
display:flex;
gap:10px;
margin:20px;
flex-wrap:wrap;
}

.tab-btn{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#111827;
color:white;
}

.content{
background:white;
margin:20px;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.tab{
display:none;
}

.tab.active{
display:block;
}

.info{
margin-bottom:12px;
font-size:16px;
}

.contact-btn{
padding:12px 20px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
Owner Dashboard
</div>

<div class="welcome">
<h2 id="welcomeText">Welcome</h2>
<p id="hotelName">Loading...</p>
</div>

<div class="tabs">

<button class="tab-btn" onclick="showTab('profile')">
Profile
</button>

<button class="tab-btn" onclick="showTab('menu')">
Menu
</button>

<button class="tab-btn" onclick="showTab('orders')">
Orders
</button>

<button class="tab-btn" onclick="showTab('plan')">
Plan
</button>

<button class="tab-btn" onclick="showTab('contact')">
Contact Us
</button>

</div>

<div class="content">

<div id="profile" class="tab active">

<div class="info"><b>Hotel :</b> <span id="pHotel"></span></div>

<div class="info"><b>Owner :</b> <span id="pOwner"></span></div>

<div class="info"><b>Email :</b> <span id="pEmail"></span></div>

<div class="info"><b>Mobile :</b> <span id="pMobile"></span></div>

<div class="info"><b>Address :</b> <span id="pAddress"></span></div>

<div class="info"><b>City :</b> <span id="pCity"></span></div>

<div class="info"><b>State :</b> <span id="pState"></span></div>

<div class="info"><b>Country :</b> <span id="pCountry"></span></div>

</div>

<div id="menu" class="tab">
<h2>Menu Section</h2>
<p>Future Menu Management</p>
</div>

<div id="orders" class="tab">
<h2>Orders Section</h2>
<p>Future Order Management</p>
</div>

<div id="plan" class="tab">
<h2>Subscription</h2>

<div class="info">
Plan :
<span id="pPlan"></span>
</div>

<div class="info">
Status :
<span id="pStatus"></span>
</div>

</div>

<div id="contact" class="tab">

<h2>Contact Support</h2>

<br>

<button class="contact-btn"
onclick="showContact()">
Show Contact </button>

<p id="contactInfo"></p>

</div>

</div>

<script>

function showTab(tabId){

document.querySelectorAll('.tab')
.forEach(tab=>tab.classList.remove('active'));

document.getElementById(tabId)
.classList.add('active');

}

function showContact(){

document.getElementById("contactInfo")
.innerHTML =
"Mobile : 9876543210 <br><br> Email : support@hotelmenu.com";

}

</script>

<script type="module" src="hotel-dashboard.js"></script>

</body>
</html>
