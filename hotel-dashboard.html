<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Client Portal | Hotel Menu Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #050505; color: #ededed; }
#authLoader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #D4AF37; }

.navbar { padding: 25px 50px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; }
.brand { font-family: 'Playfair Display', serif; font-size: 24px; color: #D4AF37; }
.logout-btn { color: #888; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }

.container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
.welcome-box { border-left: 4px solid #D4AF37; padding-left: 20px; margin-bottom: 50px; }
.welcome-box h1 { font-family: 'Playfair Display', serif; font-size: 36px; margin-bottom: 10px; }
.welcome-box p { color: #888; font-size: 16px; }

.tab-nav { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid #1a1a1a; padding-bottom: 10px; }
.tab-btn { background: transparent; border: none; color: #666; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; padding: 10px 20px; cursor: pointer; transition: 0.3s; }
.tab-btn.active { color: #D4AF37; border-bottom: 2px solid #D4AF37; }

.tab-content { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 40px; border-radius: 8px; display: none; }
.tab-content.active { display: block; animation: fadeIn 0.4s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
.info-item label { display: block; color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
.info-item div { font-size: 15px; color: #fff; }
</style>
</head>
<body>
<div id="authLoader">Establishing Secure Connection...</div>

<div class="navbar">
    <div class="brand">Hotel Menu Pro</div>
    <a href="index.html" class="logout-btn">Secure Logout</a>
</div>

<div class="container">
    <div class="welcome-box">
        <h1 id="welcomeText">Welcome</h1>
        <p id="hotelName">Loading Entity Data...</p>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="showTab('profile', this)">Corporate Profile</button>
        <button class="tab-btn" onclick="showTab('menu', this)">Menu Assets</button>
        <button class="tab-btn" onclick="showTab('plan', this)">License Details</button>
    </div>

    <div id="profile" class="tab-content active">
        <div class="grid-info">
            <div class="info-item"><label>Entity Name</label><div id="pHotel">-</div></div>
            <div class="info-item"><label>Principal Owner</label><div id="pOwner">-</div></div>
            <div class="info-item"><label>Registered Contact</label><div id="pEmail">-</div></div>
            <div class="info-item"><label>Primary Phone</label><div id="pMobile">-</div></div>
            <div class="info-item"><label>Location</label><div id="pCity">-</div></div>
            <div class="info-item"><label>Full Address</label><div id="pAddress">-</div></div>
        </div>
    </div>

    <div id="menu" class="tab-content">
        <p style="color:#888;">Menu Management Module locked by Super Admin.</p>
    </div>

    <div id="plan" class="tab-content">
        <div class="grid-info">
            <div class="info-item"><label>Service Tier</label><div id="pPlan" style="color:#D4AF37;">-</div></div>
            <div class="info-item"><label>Network Status</label><div id="pStatus">-</div></div>
        </div>
    </div>
</div>

<script>
function showTab(id, btn){
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
}
</script>
<script type="module" src="hotel-dashboard.js"></script>
</body>
</html>
