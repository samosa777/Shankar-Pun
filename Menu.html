<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotel Mantra Thakali & Hospitality - Premium CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;700&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:wght@600;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Yahan Apna Firebase Config Dalein
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- PUBLIC VIEW CHECK ---
        // Agar URL me ?public=true hai, to client view chalega (Bina login)
        const urlParams = new URLSearchParams(window.location.search);
        const isPublicView = urlParams.get("public") === "true";
        const viewHotelId = urlParams.get("hotelId");

        if (isPublicView && viewHotelId) {
            document.documentElement.style.setProperty('--admin-display', 'none');
            loadClientLiveView(viewHotelId);
        } else {
            // ADMIN VIEW LOGIC (Aapka original auth logic)
            let timer;
            function resetTimer() {
                clearTimeout(timer);
                timer = setTimeout(() => { 
                    forceLogout(); 
                }, 180000); 
            }
            window.onload = resetTimer; window.onmousemove = resetTimer; window.onkeypress = resetTimer; window.ontouchstart = resetTimer;

            onAuthStateChanged(auth, async (user) => {
                const hotelEmail = localStorage.getItem("hotelUserEmail");
                
                if (user && user.email === "superadmin@power.com") {
                    window.unlockMenu("super_admin");
                } else if (hotelEmail) {
                    try {
                        const q = query(collection(db, "hotels"), where("email", "==", hotelEmail));
                        const snap = await getDocs(q);
                        if (!snap.empty && snap.docs[0].data().status === "Active") {
                            const hotelId = snap.docs[0].id;
                            localStorage.setItem("hotelUserId", hotelId);
                            window.unlockMenu("hotel_user");
                            loadAdminSavedData(hotelId);
                        } else {
                            forceLogout();
                        }
                    } catch(e) {
                        alert("Verification Failed.");
                        forceLogout();
                    }
                } else {
                    forceLogout();
                }
            });
        }

        window.executeLogout = forceLogout;
        function forceLogout() {
            signOut(auth).then(() => {
                localStorage.removeItem("hotelUserEmail");
                localStorage.removeItem("hotelUserId");
                window.location.href = "index.html";
            });
        }

        // --- BACK BUTTON LOGIC ---
        // Logout hatakar sirf back jane ka logic
        window.goBack = function() {
            document.getElementById('portfolio-section').style.display = 'none';
            document.getElementById('themes-section').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        };

        // --- GOOGLE DRIVE URL FIXER ---
        window.fixGoogleDriveLink = function(url) {
            if (!url) return "";
            const driveRegex = /\/file\/d\/([a-zA-Z0-9_-]+)/;
            const match = url.match(driveRegex);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=view&id=${match[1]}`;
            }
            return url;
        };

        // --- SAVE DATA TO FIREBASE (Themes & Portfolio) ---
        window.savePortfolioImage = async function(imageUrl) {
            const hotelId = localStorage.getItem("hotelUserId");
            if(hotelId) {
                await updateDoc(doc(db, "hotels", hotelId), { menuPortfolioImage: imageUrl });
                alert("Photo Saved Successfully!");
                document.getElementById('portfolio-preview').src = imageUrl;
            }
        };

        window.saveDigitalTheme = async function(themeName, foodImageUrl) {
            const hotelId = localStorage.getItem("hotelUserId");
            if(hotelId) {
                const fixedUrl = fixGoogleDriveLink(foodImageUrl);
                await updateDoc(doc(db, "hotels", hotelId), { 
                    selectedTheme: themeName,
                    themeImageUrl: fixedUrl
                });
                document.getElementById('active-theme-display').innerText = "Selected Theme: " + themeName;
                document.getElementById('theme-image-preview').src = fixedUrl;
                alert("Theme & Image Saved Successfully!");
            }
        };

        // --- LOAD DATA ON ADMIN LOGIN ---
        async function loadAdminSavedData(hotelId) {
            const docSnap = await getDoc(doc(db, "hotels", hotelId));
            if (docSnap.exists()) {
                const data = docSnap.data();
                if(data.menuPortfolioImage) {
                    document.getElementById('portfolio-preview').src = data.menuPortfolioImage;
                }
                if(data.selectedTheme) {
                    document.getElementById('active-theme-display').innerText = "Selected Theme: " + data.selectedTheme;
                }
                if(data.themeImageUrl) {
                    document.getElementById('theme-image-preview').src = data.themeImageUrl;
                }
            }
        }

        // --- CLIENT PUBLIC VIEW LOGIC (NO LOGIN) ---
        async function loadClientLiveView(hotelId) {
            const docSnap = await getDoc(doc(db, "hotels", hotelId));
            if (docSnap.exists()) {
                const data = docSnap.data();
                // Client ko sirf ye div dikhega
                document.getElementById('client-public-view').style.display = 'block';
                
                // Live photo dikhao (Theme ya Portfolio)
                if(data.menuPortfolioImage) {
                    document.getElementById('client-live-image').src = data.menuPortfolioImage;
                }
            } else {
                document.getElementById('client-public-view').innerHTML = "<h2>Menu Not Found</h2>";
            }
        }

        // --- GENERATE QR CODE ---
        // Ye QR Code scan karne par public view khulega
        window.generateStaticQR = function() {
            const hotelId = localStorage.getItem("hotelUserId");
            const publicUrl = window.location.origin + window.location.pathname + "?public=true&hotelId=" + hotelId;
            
            document.getElementById("qr-code").innerHTML = "";
            const qrCode = new QRCodeStyling({
                width: 300,
                height: 300,
                data: publicUrl,
                dotsOptions: { color: "#D4AF37", type: "rounded" },
                backgroundOptions: { color: "#ffffff" }
            });
            qrCode.append(document.getElementById("qr-code"));
        };

        // UI unlocking dummy function based on your script
        window.unlockMenu = function(role) {
            document.getElementById('admin-dashboard').style.display = 'block';
            document.getElementById('main-menu').style.display = 'block';
        };
    </script>

    <style>
        :root {
            --champagne-gold: #D4AF37;
            --admin-display: block; /* Hides admin tools when public */
        }
        body { font-family: 'Poppins', sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        
        /* Admin Classes */
        .admin-only { display: var(--admin-display); }
        .dashboard { padding: 20px; max-width: 800px; margin: auto; }
        
        /* Buttons */
        .btn { background: var(--champagne-gold); color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px;}
        .btn-back { background: #333; }
        
        /* Public Client View */
        #client-public-view { display: none; text-align: center; width: 100%; height: 100vh; background: #fff; }
        #client-live-image { max-width: 100%; height: auto; }

        /* Sections */
        .section-panel { display: none; background: #fff; padding: 20px; margin-top: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-box { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; }
        .active-label { font-weight: bold; color: green; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

    <div id="client-public-view">
        <img id="client-live-image" src="" alt="Hotel Mantra Thakali & Hospitality Menu">
    </div>


    <div id="admin-dashboard" class="dashboard admin-only" style="display: none;">
        
        <div id="main-menu">
            <h2>Hotel Mantra Thakali & Hospitality - CMS</h2>
            <button class="btn" onclick="document.getElementById('main-menu').style.display='none'; document.getElementById('portfolio-section').style.display='block';">Your Menu Portfolio</button>
            <button class="btn" onclick="document.getElementById('main-menu').style.display='none'; document.getElementById('themes-section').style.display='block';">Master Digital Themes</button>
            <button class="btn" onclick="generateStaticQR(); document.getElementById('qr-section').style.display='block';">Show Client QR Code</button>
            <button class="btn btn-back" onclick="executeLogout()">Logout Completely</button>
        </div>

        <div id="portfolio-section" class="section-panel">
            <button class="btn btn-back" onclick="goBack()">Back</button>
            
            <h3>Upload Menu Photo</h3>
            <input type="text" id="portfolio-url" class="input-box" placeholder="Paste Image URL here...">
            <button class="btn" onclick="savePortfolioImage(document.getElementById('portfolio-url').value)">Save & Upload Photo</button>
            
            <div style="margin-top: 20px;">
                <p>Live Photo Preview:</p>
                <img id="portfolio-preview" src="" style="max-width: 100%; height: auto; border: 1px solid #ddd;">
            </div>
        </div>

        <div id="themes-section" class="section-panel">
            <button class="btn btn-back" onclick="goBack()">Back</button>
            <h3>Master Digital Themes</h3>
            <span id="active-theme-display" class="active-label">Selected Theme: None</span>
            
            <select id="theme-selector" class="input-box">
                <option value="Classic Gold">Classic Gold</option>
                <option value="Modern Dark">Modern Dark</option>
                <option value="Minimalist Light">Minimalist Light</option>
            </select>
            
            <h4>Food Image (Supports Google Drive Links)</h4>
            <input type="text" id="theme-food-url" class="input-box" placeholder="Paste Google Drive Image Link...">
            
            <button class="btn" onclick="saveDigitalTheme(document.getElementById('theme-selector').value, document.getElementById('theme-food-url').value)">Save Theme & Image</button>

            <div style="margin-top: 20px;">
                <p>Theme Image Preview:</p>
                <img id="theme-image-preview" src="" style="max-width: 100%; height: auto; border: 1px solid #ddd;">
            </div>
        </div>

        <div id="qr-section" class="section-panel">
            <button class="btn btn-back" onclick="document.getElementById('qr-section').style.display='none';">Close QR</button>
            <h3>Your Static Menu QR Code</h3>
            <p>Clients can scan this to see the live menu directly without login.</p>
            <div id="qr-code" style="margin: 20px auto; text-align: center;"></div>
        </div>

    </div>

</body>
</html>
